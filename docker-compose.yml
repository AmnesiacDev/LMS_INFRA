
services:

  backend:
    build:
      context: ../lms-backend-pipeline/LMS
      dockerfile: Dockerfile
    container_name: lms_backend
    restart: unless-stopped
    env_file:
      - ../LMS/.env
    networks:
      - lms_net

  frontend:
    build:
      context: ../lms-frontend-pipeline/LMS_FrontEnd
      dockerfile: Dockerfile
    container_name: lms_frontend
    restart: unless-stopped
    networks:
      - lms_net

  nginx:
    build:
      context: ../lms-nginx-pipeline/nginx
      dockerfile: Dockerfile
    container_name: lms_nginx
    restart: unless-stopped
    ports:
    - "80:80"
    - "443:443"
    volumes:
    - ./certs:/etc/nginx/certs:ro
    depends_on:
    - backend
    - frontend
    networks:
    - lms_net

networks:
  lms_net:
    driver: bridge

