
services:

  backend:
    build:
      context: ${WORKDIR}/LMS
      dockerfile: Dockerfile
    container_name: lms_backend
    restart: unless-stopped
    env_file:
      - ${WORKDIR}/LMS/.env
    networks:
      - lms_net

  frontend:
    build:
      context: ${WORKDIR}/LMS_FrontEnd
      dockerfile: Dockerfile
    container_name: lms_frontend
    restart: unless-stopped
    networks:
      - lms_net

  nginx:
    build:
      context: /opt/LMS_Infra/nginx
      dockerfile: Dockerfile
    container_name: lms_nginx
    restart: unless-stopped
    ports:
    - "80:80"
    - "443:443"
    depends_on:
    - backend
    - frontend
    networks:
    - lms_net

networks:
  lms_net:
    driver: bridge

