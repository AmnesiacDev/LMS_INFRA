# Use Docker's embedded DNS resolver
resolver 127.0.0.11 valid=10s ipv6=off;


# Canonical HTTPS site
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name algogambit.online;

    ssl_certificate /etc/letsencrypt/live/algogambit.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/algogambit.online/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;


    # ========================
    # Frontend
    # ========================

    location / {
        # Dynamically resolve frontend through Docker DNS
        set $frontend_upstream frontend;

        proxy_pass http://$frontend_upstream:80;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # ========================
    # Backend API
    # ========================

    location /api/ {
        # Dynamically resolve backend replicas
        set $backend_upstream backend;

        proxy_pass http://$backend_upstream:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # ========================
    # Socket.IO
    # ========================

    location /socket.io/ {
        # Dynamically resolve backend replicas
        set $backend_upstream backend;

        proxy_pass http://$backend_upstream:3000;

        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived Socket.IO connections
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

        proxy_buffering off;
    }
}


# =====================================
# Redirect HTTPS www → apex
# =====================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.algogambit.online;

    ssl_certificate /etc/letsencrypt/live/algogambit.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/algogambit.online/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://algogambit.online$request_uri;
}


# =====================================
# Jenkins HTTP → HTTPS
# =====================================

server {
    listen 80;
    listen [::]:80;

    server_name jenkins.algogambit.online;

    return 301 https://jenkins.algogambit.online$request_uri;
}


# =====================================
# Jenkins HTTPS → Jenkins container
# =====================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name jenkins.algogambit.online;

    ssl_certificate /etc/letsencrypt/live/algogambit.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/algogambit.online/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        set $jenkins_upstream leroy_jenkins;

        proxy_pass http://$jenkins_upstream:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}


# =====================================
# Main site HTTP → HTTPS
# =====================================

server {
    listen 80;
    listen [::]:80;

    server_name algogambit.online www.algogambit.online;

    return 301 https://algogambit.online$request_uri;
}
