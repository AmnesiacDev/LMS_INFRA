# load balancing upstream
upstream backend_servers {
    ip_hash;

    server backend:3000;
}

# Canonical HTTPS site
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name algogambit.online;

    ssl_certificate /etc/letsencrypt/live/algogambit.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/algogambit.online/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Frontend
    location / {
        proxy_pass http://frontend:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend_servers;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO
    location /socket.io/ {
        proxy_pass http://backend_servers;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }
}


# Redirect HTTPS www → apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.algogambit.online;

    ssl_certificate /etc/letsencrypt/live/algogambit.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/algogambit.online/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://algogambit.online$request_uri;
}


# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;

    server_name algogambit.online www.algogambit.online;

    return 301 https://algogambit.online$request_uri;
}
